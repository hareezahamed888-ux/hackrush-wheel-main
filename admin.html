<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — HACKRUSH 2K26</title>
  <style>
    :root{
      --bg:#040914;
      --panel:#081326;
      --neon:#3fd9ff;
      --neon-soft:#8fecff;
      --text:#eaf5ff;
      --text-muted:#7f9cc4;
    }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#040914,#081326);color:var(--text);font-family:Segoe UI, system-ui, sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
    .portal{position:relative;width:100%;max-width:420px;padding:28px;border-radius:24px;background:rgba(4,9,20,0.95);border:1px solid rgba(63,217,255,0.25);box-shadow:0 20px 60px rgba(0,0,0,0.45);overflow:hidden;}
    .portal::before{content:'';position:absolute;inset:-2px;background:linear-gradient(135deg, rgba(63,217,255,0.9), rgba(124,143,255,0.4), rgba(63,217,255,0.9));border-radius:26px;filter:blur(10px);opacity:0.7;pointer-events:none;}
    .portal > *{position:relative;}
    h1{margin:0 0 8px;font-size:28px;letter-spacing:-0.03em;text-align:center;}
    p{margin:0 0 24px;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.6;}
    .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
    label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.16em;}
    input{width:100%;padding:14px 12px;border-radius:14px;border:1px solid rgba(63,217,255,0.2);background:rgba(255,255,255,0.05);color:inherit;font-size:15px;outline:none;transition:border-color 0.2s ease, box-shadow 0.2s ease;}
    input:focus{border-color:var(--neon-soft);box-shadow:0 0 18px rgba(63,217,255,0.2);}
    button{width:100%;padding:14px 16px;border:none;border-radius:999px;background:linear-gradient(180deg, var(--neon-soft), var(--neon));color:#040914;font-weight:700;cursor:pointer;letter-spacing:0.08em;box-shadow:0 0 18px rgba(63,217,255,0.35);}
    .message{margin:12px 0 0;color:#ff8b8b;font-size:13px;min-height:18px;text-align:center;}
    .admin-panel{display:none;gap:18px;}
    .admin-panel.active{display:flex;}
    .panel-item{background:rgba(63,217,255,0.08);border:1px solid rgba(63,217,255,0.16);border-radius:16px;padding:14px;}
    .panel-item h2{margin:0 0 6px;font-size:14px;color:var(--neon-soft);}
    .panel-item p{margin:0;font-size:15px;color:var(--text);word-break:break-word;}
    .admin-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
    .admin-actions button{flex:1 1 45%;min-width:120px;}
    .info-row{font-size:13px;color:var(--text-muted);text-align:center;}
    a.back{display:block;margin-top:18px;text-align:center;color:var(--neon-soft);text-decoration:none;font-size:13px;}
    @media(max-width:480px){.portal{padding:22px;}button{font-size:14px;}}
  </style>
</head>
<body>
  <div class="portal">
    <h1>Admin Portal</h1>
    <p>Enter the admin username and password to access the portal.</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input id="adminUser" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="adminPass" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Login</button>
      <div class="message" id="loginMessage"></div>
    </form>

    <div class="admin-panel" id="adminPanel">
      <div class="panel-item">
        <h2>Team Name</h2>
        <p id="panelTeamName">—</p>
      </div>
      <div class="panel-item">
        <h2>Team Leader</h2>
        <p id="panelTeamLeader">—</p>
      </div>
      <div class="panel-item">
        <h2>Wheel Status</h2>
        <p id="panelWheelStatus">—</p>
      </div>
      <div class="panel-item">
        <h2>Winning Number</h2>
        <p id="panelWheelResult">—</p>
      </div>
      <div class="admin-actions">
        <button id="logoutBtn" type="button">Logout</button>
        <button id="refreshBtn" type="button">Refresh Data</button>
      </div>
      <div class="info-row">If you leave the page, you will need to log in again.</div>
    </div>
    <a class="back" href="INDEX.HTML">Return to Wheel</a>
  </div>

  <script>
    const credentials = { user: 'admin', pass: 'Hackrush@2k26' };
    const AUTH_KEY = 'Hackrush 2k26AdminAuth';
    const TEAM_KEY = 'Hackrush 2k26TeamName';
    const LEADER_KEY = 'Hackrush 2k26TeamLeader';
    const STORAGE_KEY = 'Hackrush 2k26WheelHasSpun';
    const RESULT_KEY = 'Hackrush 2k26WheelResult';

    const loginForm = document.getElementById('loginForm');
    const adminPanel = document.getElementById('adminPanel');
    const loginMessage = document.getElementById('loginMessage');
    const adminUser = document.getElementById('adminUser');
    const adminPass = document.getElementById('adminPass');
    const panelTeamName = document.getElementById('panelTeamName');
    const panelTeamLeader = document.getElementById('panelTeamLeader');
    const panelWheelStatus = document.getElementById('panelWheelStatus');
    const panelWheelResult = document.getElementById('panelWheelResult');
    const logoutBtn = document.getElementById('logoutBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    function setMessage(text, error = false) {
      loginMessage.textContent = text;
      loginMessage.style.color = error ? '#ff8b8b' : '#8fecff';
    }

    function loadAdminData() {
      panelTeamName.textContent = localStorage.getItem(TEAM_KEY) || 'Not set';
      panelTeamLeader.textContent = localStorage.getItem(LEADER_KEY) || 'Not set';
      const spun = localStorage.getItem(STORAGE_KEY) === 'true';
      panelWheelStatus.textContent = spun ? 'Completed' : 'Not spun';
      panelWheelResult.textContent = localStorage.getItem(RESULT_KEY) || '—';
    }

    function showAdminPanel() {
      loginForm.style.display = 'none';
      adminPanel.classList.add('active');
      loadAdminData();
    }

    function checkAuth() {
      return sessionStorage.getItem(AUTH_KEY) === 'true';
    }

    if (checkAuth()) {
      showAdminPanel();
    }

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const user = adminUser.value.trim();
      const pass = adminPass.value;
      if (user === credentials.user && pass === credentials.pass) {
        sessionStorage.setItem(AUTH_KEY, 'true');
        setMessage('Login successful. Welcome.', false);
        showAdminPanel();
      } else {
        setMessage('Invalid username or password.', true);
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem(AUTH_KEY);
      adminPanel.classList.remove('active');
      loginForm.style.display = 'block';
      setMessage('Logged out successfully.', false);
      adminUser.value = '';
      adminPass.value = '';
      adminUser.focus();
    });

    refreshBtn.addEventListener('click', loadAdminData);
  </script>
</body>
</html>
